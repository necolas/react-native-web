name: Bug report
description: File a bug report
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Create a minimal repository that reproduces the issue and link it below.
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for the bug you encountered.
      options:
        - label: I have searched the existing issues
          required: true
  - type: textarea
    attributes:
      label: Describe the issue
      description: Please provide a concise description of what you're experiencing. Providing screenshots is also helpful.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
      description: Please provide a concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Please describe the precise steps needed to reproduce the behavior.
      placeholder: |
        Mention package versions and environment (browser, etc)...
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    attributes:
      label: Test case
      description: Please provide a link to a repository with a reduced test case that reproduces the issue.
      placeholder: 'https://github.com/your-username/your-repro-repo'
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional comments
      description: You're welcome to provide additional context and proposed solutions.
